# Apache virtual host for a Linux server (Ubuntu 22.04/24.04), docs/23.
#
# Layout, from the release zip:
#   /var/www/lyceum/schoolhub      the application (not reachable from the web)
#   /var/www/lyceum/public_html    the web folder: index.php, .htaccess, assets
#
# sudo cp apache-vhost.conf /etc/apache2/sites-available/schoolhub.conf
# edit the ServerName, then:
# sudo a2enmod rewrite headers ssl && sudo a2ensite schoolhub && sudo systemctl reload apache2
# sudo certbot --apache -d enroll.yourschool.edu.ph        (free Let's Encrypt certificate)

<VirtualHost *:80>
    ServerName enroll.yourschool.edu.ph
    # Every plain-HTTP request goes to HTTPS (certbot can also add this).
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName enroll.yourschool.edu.ph
    DocumentRoot /var/www/lyceum/public_html

    <Directory /var/www/lyceum/public_html>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # The application folder is never served, even if a link points at it.
    <Directory /var/www/lyceum/schoolhub>
        Require all denied
    </Directory>

    # Documents up to 5 MB plus form fields.
    LimitRequestBody 10485760

    # Certificate lines are added by certbot:
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/enroll.yourschool.edu.ph/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/enroll.yourschool.edu.ph/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/schoolhub-error.log
    CustomLog ${APACHE_LOG_DIR}/schoolhub-access.log combined
</VirtualHost>
