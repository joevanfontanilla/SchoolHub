; PHP settings for shared hosting (docs/23).
; Upload this file into public_html and rename it to .user.ini, or set the same values in the
; panel's "PHP Configuration" / "MultiPHP INI Editor". Changes take up to 5 minutes to apply.

; SchoolHub accepts documents up to 5 MB; a form also carries its fields.
upload_max_filesize = 8M
post_max_size = 10M

; Never print errors to visitors; SchoolHub writes them to storage/logs/php-error.log.
display_errors = Off
log_errors = On

; Refuse session ids the server did not issue.
session.use_strict_mode = 1
session.cookie_httponly = 1

date.timezone = Asia/Manila
